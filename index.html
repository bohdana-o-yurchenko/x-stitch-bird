<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stitchwork — Cross Stitch &amp; Bead Pattern Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE6; --panel:#FBF8F2; --ink:#2B2620; --muted:#7A7064; --line:#E2D9CA; --line2:#CFC3B0;
  --accent:#B5452F; --accent2:#2F5D62; --sel:#F1E3D3; --shadow:0 1px 2px rgba(60,40,20,.08),0 4px 16px rgba(60,40,20,.06);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;height:100vh;grid-template-columns:1fr 360px;grid-template-rows:54px 1fr 30px;grid-template-areas:"top top" "stage side" "status side"}
.app.collapsed{grid-template-columns:1fr 0;grid-template-areas:"top top" "stage stage" "status status"}
.app.collapsed .side{display:none}
header{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:Fraunces,serif;font-weight:600;font-size:19px;letter-spacing:-.01em;margin-right:6px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{flex:none}
.pname{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;min-width:80px;max-width:220px;font-weight:500}
.pname:hover,.pname:focus{border-color:var(--line2);background:#fff;outline:none}
.sp{flex:1}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.1}
.btn:hover{background:var(--sel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sel)}
.btn.sm{padding:3px 8px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:default}
.seg{flex:none;display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 9px;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.tools{grid-area:tools;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px;overflow-y:auto}
.tool{width:40px;height:40px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;position:relative}
.tool:hover{background:var(--sel)}
.tool.on{background:var(--ink);color:#fff}
.tool svg{width:20px;height:20px}
.tsep{width:28px;height:1px;background:var(--line);margin:5px 0}
.active-swatch{width:40px;height:40px;border-radius:9px;border:1px solid var(--line2);position:relative;overflow:hidden;margin-bottom:4px;background:#fff}
.brush{font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.stgrp{display:flex;flex-direction:column;gap:3px}
.tool.st.on{background:var(--accent);color:#fff}
.brush select:disabled{opacity:.4}
.brush select{width:44px;font-size:12px;padding:2px;border:1px solid var(--line2);border-radius:6px;background:#fff}
.stage{grid-area:stage;position:relative;overflow:hidden;background:#E9E2D5}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:4px;box-shadow:var(--shadow)}
.zoomctl button{border:0;background:transparent;border-radius:7px;width:30px;height:28px}
.zoomctl button:hover{background:var(--sel)}
.zoomctl span{min-width:44px;text-align:center;align-self:center;font-size:12px;color:var(--muted)}
.status{grid-area:status;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:14px;padding:0 12px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.status b{color:var(--ink);font-weight:500}
.side{grid-area:side;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px}
.tabs button{flex:1;border:0;background:transparent;padding:12px 4px 10px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pane{flex:1;overflow-y:auto;display:none;min-height:0}
.pane.on{display:flex;flex-direction:column}
.ptop{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:sticky;top:0;background:var(--panel);z-index:2}
.row{display:flex;gap:6px;align-items:center}
.search{flex:1;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;background:#fff;min-width:0}
.list{padding:4px 0}
.it{display:flex;align-items:center;gap:10px;padding:5px 12px;cursor:pointer;border-left:3px solid transparent}
.it:hover{background:var(--sel)}
.it.on{background:var(--sel);border-left-color:var(--accent)}
.sw{width:26px;height:26px;border-radius:6px;border:1px solid rgba(0,0,0,.15);flex:none;position:relative}
.sw.bead{border-radius:50%;box-shadow:inset -3px -3px 5px rgba(0,0,0,.25),inset 3px 3px 5px rgba(255,255,255,.5)}
.sw.split{overflow:hidden}
.it .code{font-weight:600;min-width:52px;font-variant-numeric:tabular-nums}
.it .nm{color:var(--muted);font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;padding:1px 6px;border-radius:10px;background:#EFE7DA;color:var(--muted);white-space:nowrap}
.section{padding:12px;border-bottom:1px solid var(--line)}
.section h3{font-family:Fraunces,serif;font-weight:600;font-size:15px;margin:0 0 8px}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:4px 0 0}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line2);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink);font-size:13.5px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.blendprev{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:13px}
.blendprev .big{width:44px;height:44px;border-radius:8px;border:1px solid rgba(0,0,0,.15)}
.tweed{background-size:8px 8px}
.keytbl{width:100%;border-collapse:collapse;font-size:13px}
.keytbl td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.keytbl tr:hover td{background:var(--sel)}
.sym{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.18);display:grid;place-items:center;font-size:15px;font-weight:600;cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{border:0;background:transparent;border-radius:6px;padding:3px 5px;color:var(--muted)}
.iconbtn:hover{background:#EADFCF;color:var(--ink)}
.totals{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.totals b{color:var(--ink);font-weight:600}
.modal-back{position:fixed;inset:0;background:rgba(40,30,20,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-back.on{display:flex}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(40,25,10,.25);width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column}
.modal h2{font-family:Fraunces,serif;font-weight:600;font-size:19px;margin:0;padding:16px 18px 6px}
.modal .mbody{padding:8px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.modal .mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px}
.refwin{position:fixed;z-index:31;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 40px rgba(40,25,10,.28);display:flex;flex-direction:column;overflow:hidden}
.refwin .rh{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;cursor:move;background:#EFE7DA;user-select:none;touch-action:none;border-bottom:1px solid var(--line)}
.refwin .rt{flex:1;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:30px}
.refwin .rtin{flex:1;min-width:30px;font-size:13px;border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
.refwin .rop{width:64px;accent-color:#B5452F}
.refwin .rbtn{border:0;background:transparent;border-radius:6px;width:24px;height:22px;color:var(--muted);font-size:12px}
.refwin .rbtn:hover{background:#E2D6C4;color:var(--ink)}
.refwin .rtb{display:flex;align-items:center;gap:2px;padding:3px 5px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.refwin .rtb button{border:0;background:transparent;border-radius:6px;width:28px;height:26px;display:grid;place-items:center;color:var(--ink)}
.refwin .rtb button:hover{background:var(--sel)}
.refwin .rtb button.on{background:var(--ink);color:#fff}
.refwin .rcol{width:26px;height:24px;border:1px solid var(--line2);border-radius:5px;padding:1px;background:#fff}
.refwin .rsize{font-size:12px;border:1px solid var(--line2);border-radius:5px;padding:2px;background:#fff;margin-left:2px}
.refwin .rsep{width:1px;height:18px;background:var(--line2);margin:0 4px}
.refwin .rb{flex:1;position:relative;min-height:0;background:#E9E2D5}
.refwin canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.refwin .rinfo{position:absolute;left:6px;bottom:5px;font-size:11px;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:6px;pointer-events:none}
.refwin .rinfo:empty{display:none}
.refwin .rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,rgba(60,40,20,.35) 50%,rgba(60,40,20,.35) 58%,transparent 58%,transparent 70%,rgba(60,40,20,.35) 70%,rgba(60,40,20,.35) 78%,transparent 78%);z-index:2}
.refwin.min .rtb,.refwin.min .rb,.refwin.min .rs{display:none}

/* side panel */
.side{min-width:0}
.ptools{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:8px 8px;border-bottom:1px solid var(--line)}
.ptools .tool,.mini .tool{width:34px;height:34px;border-radius:8px}
.ptools .tool svg,.mini .tool svg{width:18px;height:18px}
.tool:disabled{opacity:.35;cursor:default}
.psep{width:1px;height:22px;background:var(--line2);margin:0 4px}
.bsel{font-size:12px;border:1px solid var(--line2);border-radius:7px;padding:4px 2px;background:#fff;height:30px}
.keyhead{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.keyhead h3{font-family:Fraunces,serif;font-weight:600;font-size:16px;margin:0}
.kcount{font-size:12px;color:var(--muted)}
.keylist{flex:1;overflow-y:auto;min-height:120px;border-top:1px solid var(--line)}
.krow{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 10px;border-left:3px solid transparent;cursor:pointer;border-bottom:1px solid #EEE6D8}
.krow:hover{background:#F5EEE3}
.krow.on{background:var(--sel);border-left-color:var(--accent)}
.krow canvas.sym{border-radius:5px;border:1px solid rgba(0,0,0,.18);flex:none}
.krow .kt{flex:1;min-width:0}
.krow .k1{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krow .k2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krow .kn{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;min-width:44px}
.krow .ka{display:flex;opacity:.45}
.krow:hover .ka,.krow.on .ka{opacity:1}
.kshort{display:inline-block;font-size:10px;font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.kempty{padding:24px 16px;text-align:center}
.kempty p{margin:0 0 8px}
.psec{border-top:1px solid var(--line)}
.psec summary{padding:10px 12px;font-weight:600;cursor:pointer;font-size:13.5px;list-style-position:inside}
.psec .section{padding-top:0;border-bottom:0}
#keyTotals .totals{margin-top:0}
/* mini strip when the panel is hidden */
.mini{position:absolute;left:34px;top:34px;display:none;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:5px;box-shadow:var(--shadow);z-index:5}
.app.collapsed .mini{display:flex}
.mini-key{width:34px;height:34px;cursor:pointer;margin:2px 0}
.mini-key canvas{border-radius:6px;border:1px solid rgba(0,0,0,.2)}
/* add-to-key dialog */
.kdlg{display:flex;flex-direction:column;gap:12px}
.krow2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.klabel{font-size:12px;color:var(--muted);min-width:56px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.karea{display:flex;flex-direction:column;gap:8px}
.two{display:grid;grid-template-columns:1fr;gap:12px}
.plist .row{flex-wrap:wrap}
.plist .row .search{flex:1 1 180px;min-width:0}
.modal{max-width:100%}
.modal .mbody{overflow-x:hidden}
.plist{display:flex;flex-direction:column;gap:6px}
.plrows{overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.plrows .it{padding:4px 10px}
.cform{display:none;gap:6px;align-items:center}
.cform.on{display:flex}
.bed{display:flex;flex-direction:column;gap:6px}
.sugbox{display:flex;flex-direction:column}
.kopts{display:flex;flex-direction:column;gap:10px;padding-top:4px;border-top:1px solid var(--line)}
.symbtn{width:38px;height:38px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:20px}
.kprev{display:flex;align-items:center;gap:12px;padding:10px;background:#F3ECE0;border-radius:10px}
.kprev canvas.sym{border-radius:8px;border:1px solid rgba(0,0,0,.18)}
.kwarn:empty{display:none}
.kwarn{font-size:13px;background:#FFF4D6;border:1px solid #EBD28E;border-radius:8px;padding:8px 10px}
.modal .seg button{padding:6px 12px}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:8px 14px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none;z-index:60;font-size:13px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.dropzone{position:fixed;inset:10px;z-index:70;display:none;align-items:center;justify-content:center;border:3px dashed var(--accent);border-radius:16px;background:rgba(244,239,230,.85);pointer-events:none;font-family:Fraunces,serif;font-size:22px;font-weight:600;color:var(--accent)}
.dropzone.on{display:flex}
.sugg{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:7px;cursor:pointer}
.sugg:hover{background:var(--sel)}
.sugg .de{margin-left:auto;font-size:11.5px;color:var(--muted)}
.projlist .it{padding:8px 10px;border-radius:8px}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;max-height:58vh;overflow-y:auto;padding:2px}
.symgrid button{height:32px;border:1px solid var(--line2);border-radius:6px;background:#fff;font-size:16px}
.symgrid button.used{opacity:.3}
.symgrid button.cur{background:var(--ink);color:#fff}
canvas.prev{max-width:100%;image-rendering:pixelated;border:1px solid var(--line2);border-radius:6px;background:#fff;align-self:center}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
.menu{position:absolute;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:4px;z-index:40;display:none;min-width:200px}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px}
.menu button:hover{background:var(--sel)}
.hide-sm{}
@media (max-width:1320px){.brand span{display:none}header .btn.ghost{padding:6px 7px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="5" fill="#B5452F"/><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span class="hide-sm">Stitchwork</span>
    </div>
    <input class="pname" id="pname" value="Untitled pattern" aria-label="Pattern name">
    <button class="btn ghost" id="bNew" title="New pattern">New</button>
    <button class="btn ghost" id="bOpen" title="Open saved pattern">Open</button>
    <button class="btn ghost" id="bSave" title="Save pattern (Ctrl/⌘+S)">Save</button>
    <button class="btn ghost" id="bFileSave" title="Download the pattern as a file you can keep anywhere (.json or .oxs)">Save to file</button>
    <button class="btn ghost" id="bFileLoad" title="Load a .json or .oxs pattern file">Load file</button>
    <button class="btn ghost" id="bImport" title="Convert a picture into a pattern">Image → pattern</button>
    <button class="btn ghost" id="bRef" title="Open a reference photo in a floating window (you can open several)">+ Reference</button>
    <div class="sp"></div>
    <div class="seg" id="viewSeg" title="Chart view">
      <button data-v="color">Colour</button><button data-v="both" class="on">Both</button><button data-v="sym">Symbols</button>
    </div>
    <button class="btn" id="bExport">Export ▾</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="mini" id="mini">
      <button class="tool" id="miniExpand" title="Show panel (K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 6l-6 6 6 6"/><path d="M20 4v16"/></svg></button>
      <div class="mini-key" id="miniKey" title="Active key entry"></div>
      <button class="tool" data-t="pencil" title="Draw (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
      <button class="tool" data-t="eraser" title="Eraser (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 20h12M4.5 14.5l9-9 6 6-8.5 8.5H9z"/></svg></button>
      <button class="tool" data-t="picker" title="Pick from chart (I, or hold Alt/⌥)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5a2.1 2.1 0 013 3l-1.5 1.5-3-3z"/><path d="M13.5 6l4.5 4.5M15 9l-8.5 8.5L4 20l2.5-2.5"/></svg></button>
      <button class="tool" data-t="pan" title="Move (H, or hold Space)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
      <button class="tool bOverride" title="Override (O): when on, drawing replaces stitches already on the chart. Off = only empty squares are filled."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="11" height="11" rx="1.5"/><rect x="9.5" y="9.5" width="11" height="11" rx="1.5" fill="currentColor" fill-opacity=".25"/></svg></button>
      <button class="tool bUndo" title="Undo (Ctrl/⌘+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="tool bRedo" title="Redo (Ctrl+Y / ⌘⇧Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    </div>
    <div class="zoomctl">
      <button id="zOut" title="Zoom out">−</button><span id="zLbl">100%</span><button id="zIn" title="Zoom in">+</button><button id="zFit" title="Fit to screen (0)">⤢</button>
    </div>
  </main>

  <div class="status" id="status">
    <span id="stPos">—</span><span id="stCell"></span><span class="sp"></span><span class="hint" style="margin:0">Space = move · hold Alt/⌥ = pick · O = override · Esc ends a backstitch line · 1–9 pick key entries · K hides the panel</span><span id="stSize"></span><span id="stSave"></span>
  </div>

  <aside class="side" id="side">
    <div class="ptools">

const hexToRgb=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const rgbToHex=c=>'#'+c.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
const s2l=c=>{c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
const l2s=c=>(c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055)*255;
function linToLab(l){const r=l[0],g=l[1],b=l[2];
  const X=(r*0.4124+g*0.3576+b*0.1805)/0.95047,Y=r*0.2126+g*0.7152+b*0.0722,Z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;const fx=f(X),fy=f(Y),fz=f(Z);
  return[116*fy-16,500*(fx-fy),200*(fy-fz)]}
const rgbToLab=rgb=>linToLab(rgb.map(s2l));
const dE2=(a,b)=>{const x=a[0]-b[0],y=a[1]-b[1],z=a[2]-b[2];return x*x+y*y+z*z};
function mkColor(e){e.hex=e.hex.toUpperCase();if(e.hex[0]!=='#')e.hex='#'+e.hex;e.rgb=hexToRgb(e.hex);e.lin=e.rgb.map(s2l);e.lab=linToLab(e.lin);
  const [r,g,b]=e.rgb.map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
  const L=(mx+mn)/2,S=d?d/(1-Math.abs(2*L-1)):0;e.hue=S<0.12?1000+(1-L):h+L*0.001;
  e.ink=(0.299*e.rgb[0]+0.587*e.rgb[1]+0.114*e.rgb[2])>150?'#1d1a16':'#fff';return e}

function refFit(r){if(!r.img)return;const b=r.body.getBoundingClientRect();const W=b.width||r.w,H=b.height||(r.h-80);const s=Math.min(W/r.img.width,H/r.img.height)*.96;
  r.view={s,tx:(W-r.img.width*s)/2,ty:(H-r.img.height*s)/2}}
function refPushUndo(r){try{r.undo.push(r.marks.getContext('2d').getImageData(0,0,r.marks.width,r.marks.height));if(r.undo.length>6)r.undo.shift()}catch(e){}}
function refCanvasEvents(r){const c=r.cv;let act=null;
  const toImg=(e)=>{const b=c.getBoundingClientRect(),v=r.view;return{x:(e.clientX-b.left-v.tx)/v.s,y:(e.clientY-b.top-v.ty)/v.s,sx:e.clientX-b.left,sy:e.clientY-b.top}};
  c.addEventListener('pointerdown',e=>{if(!r.img||!r.view)return;e.preventDefault();c.setPointerCapture(e.pointerId);const p=toImg(e);
    if(e.button===1||e.button===2||r.tool==='pan'){act={pan:true,sx:p.sx,sy:p.sy,tx:r.view.tx,ty:r.view.ty};c.style.cursor='grabbing';return}
    if(e.button!==0)return;refPushUndo(r);act={last:p};refStroke(r,p,p)});
  c.addEventListener('pointermove',e=>{if(!r.img||!r.view)return;const p=toImg(e);
    if(r.grid&&typeof P!=='undefined'){const cx=Math.floor(p.x/(r.img.width/P.w)),cy=Math.floor(p.y/(r.img.height/P.h));r.info.textContent=(cx>=0&&cy>=0&&cx<P.w&&cy<P.h)?`Column ${cx+1} · Row ${cy+1}`:''}else r.info.textContent='';
    if(!act)return;if(act.pan){r.view.tx=act.tx+p.sx-act.sx;r.view.ty=act.ty+p.sy-act.sy;refDraw(r);return}
    refStroke(r,act.last,p);act.last=p});
  const end=()=>{if(!act)return;if(!act.pan)refSave();act=null;refUI(r)};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('contextmenu',e=>e.preventDefault());
  c.addEventListener('pointerleave',()=>{r.info.textContent=''});
  c.addEventListener('wheel',e=>{e.preventDefault();e.stopPropagation();if(!r.view)return;const b=c.getBoundingClientRect(),sx=e.clientX-b.left,sy=e.clientY-b.top;
    const f=Math.exp(-Math.max(-120,Math.min(120,e.deltaY*(e.deltaMode?33:1)))*0.0025),ns=Math.max(.02,Math.min(40,r.view.s*f));
    r.view.tx=sx-(sx-r.view.tx)*ns/r.view.s;r.view.ty=sy-(sy-r.view.ty)*ns/r.view.s;r.view.s=ns;refDraw(r);refSave()},{passive:false})}
function refStroke(r,a,b){const g=r.marks.getContext('2d');g.save();g.globalCompositeOperation=r.tool==='eraser'?'destination-out':'source-over';
  g.strokeStyle=r.color;g.fillStyle=r.color;g.lineCap='round';g.lineJoin='round';g.lineWidth=Math.max(1,r.size/r.view.s);
  g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x+.01,b.y);g.stroke();g.restore();if(r.tool==='marker')r.hasMarks=true;refDraw(r)}
function refDraw(r){if(!r.el.isConnected||r.min)return;const c=r.cv,b=r.body.getBoundingClientRect();if(!b.width||!b.height)return;const d=window.devicePixelRatio||1;
  if(c.width!==Math.round(b.width*d)||c.height!==Math.round(b.height*d)){c.width=Math.round(b.width*d);c.height=Math.round(b.height*d)}
  const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.fillStyle='#E9E2D5';g.fillRect(0,0,b.width,b.height);
  if(!r.img){g.fillStyle='#7A7064';g.font='13px "DM Sans",sans-serif';g.textAlign='center';g.fillText('Loading…',b.width/2,b.height/2);return}
  if(!r.view)refFit(r);const v=r.view;g.save();g.translate(v.tx,v.ty);g.scale(v.s,v.s);
  g.imageSmoothingEnabled=v.s<3;g.drawImage(r.img,0,0);
  const cw=r.img.width/P.w,ch=r.img.height/P.h;
  if(r.showSt){g.fillStyle='rgba(181,69,47,.38)';g.beginPath();for(let y=0;y<P.h;y++)for(let x=0;x<P.w;x++){const i=y*P.w+x;if(P.stitches[i]||P.beads[i])g.rect(x*cw,y*ch,cw,ch)}g.fill()}
  g.globalAlpha=.5;g.drawImage(r.marks,0,0);g.globalAlpha=1;
  if(r.grid){const px=cw*v.s;
    if(px>=4){g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=1/v.s;g.beginPath();for(let x=1;x<P.w;x++)if(x%10){g.moveTo(x*cw,0);g.lineTo(x*cw,r.img.height)}for(let y=1;y<P.h;y++)if(y%10){g.moveTo(0,y*ch);g.lineTo(r.img.width,y*ch)}g.stroke()}
    g.strokeStyle='rgba(20,10,0,.75)';g.lineWidth=1.6/v.s;g.beginPath();for(let x=0;x<=P.w;x+=10){g.moveTo(x*cw,0);g.lineTo(x*cw,r.img.height)}for(let y=0;y<=P.h;y+=10){g.moveTo(0,y*ch);g.lineTo(r.img.width,y*ch)}g.stroke();g.strokeRect(0,0,r.img.width,r.img.height);
    const h=typeof hover!=='undefined'?hover:null;
    if(h&&h.x>=0&&h.y>=0&&h.x<P.w&&h.y<P.h){g.strokeStyle='#B5452F';g.lineWidth=2.5/v.s;g.strokeRect(h.x*cw,h.y*ch,cw,ch);
      g.lineWidth=1/v.s;g.setLineDash([4/v.s,4/v.s]);g.beginPath();g.moveTo((h.x+.5)*cw,0);g.lineTo((h.x+.5)*cw,h.y*ch);g.moveTo((h.x+.5)*cw,(h.y+1)*ch);g.lineTo((h.x+.5)*cw,r.img.height);
      g.moveTo(0,(h.y+.5)*ch);g.lineTo(h.x*cw,(h.y+.5)*ch);g.moveTo((h.x+1)*cw,(h.y+.5)*ch);g.lineTo(r.img.width,(h.y+.5)*ch);g.stroke();g.setLineDash([])}}
  g.restore()}
let refRQ=false;function refsRender(onlyGrid){if(!REFS.length||refRQ)return;refRQ=true;requestAnimationFrame(()=>{refRQ=false;REFS.forEach(r=>{if(!onlyGrid||r.grid)refDraw(r)})})}
function refsHover(){if(REFS.some(r=>r.grid))refsRender(true)}
function refSerialize(r){let marks=null;if(r.hasMarks){if(!r.marksReady)marks=r.marksSrc;else try{marks=r.marks.toDataURL('image/png')}catch(e){}}
  return{id:r.id,name:r.name,src:r.src,x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.w),h:Math.round(r.h),min:r.min,op:r.op,view:r.view,tool:r.tool,color:r.color,size:r.size,grid:r.grid,showSt:r.showSt,marks}}
function refsExport(){return REFS.map(refSerialize)}
/* Photos + marks live in IndexedDB (store "refs", key = project id): localStorage's ~5 MB fills up after a photo or two.
   Older versions kept them in localStorage under stitchwork.refs.<id>; those are read once and moved over. */
const IDB=(()=>{let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{const q=indexedDB.open('stitchwork',1);q.onupgradeneeded=()=>q.result.createObjectStore('refs');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('refs',mode),q=fn(t.objectStore('refs'));t.oncomplete=()=>res(q.result);t.onerror=t.onabort=()=>rej(t.error)}));
  return{get:k=>run('readonly',s=>s.get(k)),set:(k,v)=>run('readwrite',s=>s.put(v,k)),del:k=>run('readwrite',s=>s.delete(k))}})();
let refsReady=false,refsDirty=false;   // ready = this project's windows have been restored, so saving can't overwrite them with nothing
function refSave(){refsDirty=true;clearTimeout(refsSaveT);refsSaveT=setTimeout(()=>{refsSaveNow();autosave()},700)}
function refsSaveNow(){clearTimeout(refsSaveT);if(!refsPid||!refsReady)return;refsDirty=false;
  const pid=refsPid,data=refsExport(),lsKey='stitchwork.refs.'+pid;
  (data.length?IDB.set(pid,data):IDB.del(pid)).then(()=>{try{localStorage.removeItem(lsKey)}catch(e){}})
    .catch(()=>{try{if(data.length)localStorage.setItem(lsKey,JSON.stringify(data));else localStorage.removeItem(lsKey)}
      catch(e){if(!refsWarned){refsWarned=true;toast('Reference photos are too big to remember in this browser — use Save to file (.json) to keep them')}}})}
async function refsSwitch(pid,incoming){
  if(refsDirty)refsSaveNow();
  REFS.forEach(r=>r.el.remove());REFS=[];refsPid=pid;refsReady=false;let data=incoming;
  if(!data){data=await IDB.get(pid).catch(()=>undefined);
    if(!data){try{data=JSON.parse(localStorage.getItem('stitchwork.refs.'+pid)||'[]')}catch(e){data=[]}}
    if(refsPid!==pid)return}   // another pattern was opened while this one was loading
  refsReady=true;(data||[]).forEach(d=>{if(d&&d.src)refCreate(d)})}
/* write pending work straight away when the page is refreshed, closed or hidden */
function flushAll(){if(refsDirty)refsSaveNow();if(!P)return;clearTimeout(autoT);try{localStorage.setItem('stitchwork.current',JSON.stringify(serialize()))}catch(e){}}
window.addEventListener('pagehide',flushAll);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushAll()});
window.addEventListener('resize',()=>REFS.forEach(refPlace));
$('#bRef').onclick=refAdd;

/* ============================================================ BOOT */
(function boot(){
  let restored=false;try{const s=localStorage.getItem('stitchwork.current');if(s){load(JSON.parse(s));restored=true}}catch(e){console.warn(e)}
  if(!restored){P=newProject(60,60,'Untitled pattern');refreshPal();afterLoad();seedDemo()}
  new ResizeObserver(()=>{const r=cv.getBoundingClientRect();if(r.width!==CW||r.height!==CH)resizeCanvas()}).observe(cv);
  resizeCanvas();fit();updUndo();setTool('pencil');
})();
function seedDemo(){
  const heart=['..XX...XX..','.XXXX.XXXX.','XXXXXXXXXXX','XXXXXXXXXXX','XXXXXXXXXXX','.XXXXXXXXX.','..XXXXXXX..','...XXXXX...','....XXX....','.....X.....'];
  const ox=24,oy=22;

  P.blends['blend:demo']={parts:[{id:'dmc:3713',n:1},{id:'dmc:Ecru',n:1}]};const bl=addKey({t:'thread',src:'blend:demo',n:null,st:'full'});
  P.combos['combo:demo']={thread:'dmc:3371',bead:'bead:00557'};const cmb=addKey({t:'combo',src:'combo:demo',n:2,st:'half'});
  const half=addKey({t:'thread',src:'dmc:310',n:1,st:'half'});

  refreshPal();renderKey();setActiveK(red);render();autosave()}
